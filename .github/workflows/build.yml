
name: Compilar Neon Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Localizar projeto
        id: projeto
        run: |
          FILE=$(find . -name build.gradle \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERRO: build.gradle não encontrado"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $DIR"

      - name: Compilar Neon Client
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          gradle build --no-daemon --stacktrace

      - name: Preparar arquivo JAR
        if: success()
        run: |
          mkdir -p output
          find "${{ steps.projeto.outputs.dir }}" \
            -type f -path '*/build/libs/*.jar' \
            -not -name '*-sources.jar' \
            -not -name '*-dev.jar' \
            -exec cp {} output/ \;

          ls -lah output/

      - name: Enviar arquivo JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Client
          path: output/*.jar
          if-no-files-found: error
          
